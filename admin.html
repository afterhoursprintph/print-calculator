<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterHours Print PH - Operator Dashboard</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 24px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    header h1 { margin: 0; font-size: 1.8rem; color: #fff; }
    header h1 span { color: var(--accent-blue); }
    
    .status-badge-live { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

    .controls-bar { display: flex; gap: 12px; margin-bottom: 20px; }
    .btn-refresh { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-refresh:hover { border-color: var(--accent-blue); }

    .orders-grid { display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; }
    
    .order-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; }
    .order-card.completed { opacity: 0.6; border-color: #1e293b; }

    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .customer-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin: 0; }
    .order-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .pay-tag { font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; }
    .pay-cash { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .pay-online { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

    .files-list { margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .file-row { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .file-details { display: flex; flex-direction: column; gap: 2px; }
    .file-title { font-weight: 600; font-size: 0.95rem; color: #fff; }
    .file-sub { font-size: 0.8rem; color: var(--text-muted); }

    .btn-download { background: var(--accent-blue); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
    .btn-download:hover { background: #0284c7; color: #fff; }

    .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border-color); }
    .order-total { font-size: 1.2rem; font-weight: 800; color: var(--success); }

    .status-select { background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; font-weight: 600; outline: none; cursor: pointer; }
    .status-select:focus { border-color: var(--accent-blue); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>AfterHours <span>Print Queue Operator</span></h1>
    <div class="status-badge-live">
      <div class="pulse-dot"></div> Realtime Queue Active
    </div>
  </header>

  <div class="controls-bar" style="max-width: 900px; margin: 0 auto 20px auto;">
    <button class="btn-refresh" onclick="fetchOrders()">🔄 Refresh Queue</button>
  </div>

  <div id="ordersContainer" class="orders-grid">
    <div class="empty-state">Loading print queue...</div>
  </div>

<script>
  const SUPABASE_URL = 'https://rqzvjnhjeqnfpsiemcwh.supabase.co';
  // Insert your actual Supabase Anon API key here
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Web Audio API beep notification for new incoming orders
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime); // High pitch A5
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } catch(e) { console.log('Audio disabled until user interacts'); }
  }

  async function fetchOrders() {
    const container = document.getElementById('ordersContainer');

    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      container.innerHTML = `<div class="empty-state" style="color: var(--danger);">Failed to load orders: ${error.message}</div>`;
      return;
    }

    if (!orders || orders.length === 0) {
      container.innerHTML = `<div class="empty-state">No print orders received yet.</div>`;
      return;
    }

    container.innerHTML = '';

    orders.forEach(order => {
      const isCompleted = order.status === 'Completed';
      const orderCard = document.createElement('div');
      orderCard.className = `order-card ${isCompleted ? 'completed' : ''}`;

      const dateStr = new Date(order.created_at).toLocaleString();
      const payClass = order.payment_method === 'Cash' ? 'pay-cash' : 'pay-online';

      // Build file rows with direct download links
      let filesHTML = '';
      if (Array.isArray(order.files_data)) {
        order.files_data.forEach(file => {
          // Generate direct public URL from Supabase storage
          const { data: publicUrlData } = supabaseClient
            .storage
            .from('customer-files')
            .getPublicUrl(file.path);

          const copyLabel = file.copies > 1 ? ` (${file.copies} Copies)` : '';

          filesHTML += `
            <div class="file-row">
              <div class="file-details">
                <div class="file-title">📄 ${file.name}${copyLabel}</div>
                <div class="file-sub">Storage Path: ${file.path}</div>
              </div>
              <a href="${publicUrlData.publicUrl}" download target="_blank" class="btn-download">
                📥 Download PDF
              </a>
            </div>
          `;
        });
      }

      orderCard.innerHTML = `
        <div class="order-header">
          <div>
            <h3 class="customer-title">👤 ${order.customer_name || 'Guest'}</h3>
            <div class="order-time">Received: ${dateStr}</div>
          </div>
          <span class="pay-tag ${payClass}">${order.payment_method}</span>
        </div>

        <div class="files-list">
          ${filesHTML || '<div style="color: var(--text-muted);">No file details attached.</div>'}
        </div>

        <div class="order-footer">
          <div>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Total Amount:</span>
            <div class="order-total">₱${order.total_amount}</div>
          </div>
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted); display:block; margin-bottom: 2px;">STATUS:</label>
            <select class="status-select" onchange="updateOrderStatus('${order.id}', this.value)">
              <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
              <option value="Printing" ${order.status === 'Printing' ? 'selected' : ''}>🖨️ Printing</option>
              <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
            </select>
          </div>
        </div>
      `;

      container.appendChild(orderCard);
    });
  }

  async function updateOrderStatus(orderId, newStatus) {
    const { error } = await supabaseClient
      .from('orders')
      .update({ status: newStatus })
      .eq('id', orderId);

    if (error) {
      alert('Failed to update status: ' + error.message);
    } else {
      fetchOrders();
    }
  }

  // Realtime Supabase listener for instant order pop-ups
  function setupRealtimeListener() {
    supabaseClient
      .channel('public:orders')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
        playBeep();
        fetchOrders();
      })
      .subscribe();
  }

  // Initial load
  fetchOrders();
  setupRealtimeListener();
</script>
</body>
</html>
