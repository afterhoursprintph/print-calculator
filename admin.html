<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterHours Print PH - Operator Dashboard</title>

  <!-- Tab Favicon Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- In-App Browser Auto-Bypass (Messenger + Telegram) -->
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInApp = /FB_IAB|FBAN|FBAV|Messenger|Telegram/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      // 1. Auto-breakout for Android (Opens Chrome directly)
      if (isInApp && isAndroid) {
        const targetUrl = window.location.href.replace(/^https?:\/\//, '');
        window.location.href = 'intent://' + targetUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;end;';
      }

      // 2. Banner alert for iOS (Prompts Safari breakout)
      if (isInApp && isIOS) {
        document.addEventListener('DOMContentLoaded', function () {
          const banner = document.createElement('div');
          banner.style.cssText = 'background:#0284c7; color:#fff; text-align:center; padding:10px 14px; font-size:13px; font-weight:600; position:sticky; top:0; z-index:9999; box-shadow:0 2px 8px rgba(0,0,0,0.2);';
          banner.innerHTML = '💡 For full admin tools & document preview, tap <strong>•••</strong> at the top right and choose <strong>"Open in Safari"</strong>.';
          document.body.prepend(banner);
        });
      }
    })();
  </script>
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 24px 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 880px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    header h1 { margin: 0; font-size: 1.8rem; color: #fff; }
    header h1 span { color: var(--accent-blue); }
    
    .status-badge-live { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

    /* Control Bar & Search */
    .controls-wrapper { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .tabs-group { display: flex; gap: 8px; background: #0f172a; padding: 4px; border-radius: 10px; border: 1px solid var(--border-color); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { background: var(--card-bg); color: var(--accent-blue); border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    
    .badge-count { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 800; border: 1px solid rgba(56, 189, 248, 0.3); }
    .tab-btn.active .badge-count { background: var(--accent-blue); color: #000; border: none; }

    .search-box { flex: 1; min-width: 220px; position: relative; }
    .search-input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 10px 14px 10px 38px; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border 0.2s; }
    .search-input:focus { border-color: var(--accent-blue); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }

    .btn-refresh { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .btn-refresh:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

    /* Orders List */
    .orders-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    
    .order-card { 
      background: var(--card-bg); 
      border: 1.5px solid #475569; 
      border-radius: 12px; 
      padding: 20px; 
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); 
      position: relative; 
    }

    .order-card.completed { 
      opacity: 0.65; 
      background: rgba(30, 41, 59, 0.4); 
      border: 1.5px solid rgba(56, 189, 248, 0.35); 
      backdrop-filter: blur(6px); 
    }

    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .customer-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin: 0; }
    .order-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .pay-tag { font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; }
    .pay-cash { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .pay-online { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

    .files-list { margin: 16px 0; display: flex; flex-direction: column; gap: 12px; }
    .file-row { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .file-details { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .file-title { font-weight: 700; font-size: 1rem; color: #fff; }
    
    .specs-list { display: flex; flex-direction: column; gap: 4px; }
    .spec-item { font-size: 0.85rem; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
    .paper-badge { background: #000; color: var(--accent-blue); font-weight: 800; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.75rem; border: 1px solid var(--accent-blue); }
    .copy-badge { background: rgba(255,255,255,0.1); color: #fff; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }

    .btn-download { background: var(--accent-blue); color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 800; cursor: pointer; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-download:hover { background: #0284c7; color: #fff; }

    .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border-color); }
    .order-total { font-size: 1.25rem; font-weight: 800; color: var(--success); }

    .status-select { background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; font-weight: 600; outline: none; cursor: pointer; }
    .status-select:focus { border-color: var(--accent-blue); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 12px; border: 1px dashed var(--border-color); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>AfterHours <span>Print Queue Operator</span></h1>
    <div class="status-badge-live">
      <div class="pulse-dot"></div> Realtime Queue Active
    </div>
  </header>

  <div class="controls-wrapper">
    <div class="top-nav">
      <div class="tabs-group">
        <button id="tabActive" class="tab-btn active" onclick="switchTab('active')">
          🖨️ Active Queue <span id="activeBadge" class="badge-count">0</span>
        </button>
        <button id="tabCompleted" class="tab-btn" onclick="switchTab('completed')">
          📁 Completed Archive <span id="completedBadge" class="badge-count">0</span>
        </button>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search customer or file name..." oninput="renderOrders()">
      </div>

      <button class="btn-refresh" onclick="fetchOrders()">🔄 Refresh</button>
    </div>
  </div>

  <div id="ordersContainer" class="orders-grid">
    <div class="empty-state">Loading print queue...</div>
  </div>
</div>

<!-- Dark-Themed Receipt Popup Modal (Matches index.html) -->
<div id="receiptModal" onclick="closeReceiptModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.9); z-index:10000; align-items:center; justify-content:center; padding:16px; box-sizing:border-box;">
  <div style="position:relative; width:100%; max-width:420px; background:#1e293b; color:#f8fafc; border:1.5px solid #334155; border-radius:16px; padding:24px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.6); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;" onclick="event.stopPropagation()">
    <span onclick="closeReceiptModal()" style="position:absolute; top:14px; right:18px; font-size:24px; font-weight:bold; cursor:pointer; color:#94a3b8;">&times;</span>
    
    <!-- Receipt Header -->
    <div style="text-align:center; border-bottom:2px dashed #334155; padding-bottom:14px; margin-bottom:16px;">
      <h2 style="margin:0; font-size:1.35rem; color:#fff; font-weight:800;">AfterHours <span style="color:#38bdf8;">Print PH</span></h2>
      <p style="margin:4px 0 0; font-size:0.75rem; color:#94a3b8; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Official Order Receipt</p>
    </div>

    <!-- Receipt Content -->
    <div id="receiptBody"></div>

    <!-- Footer -->
    <div style="margin-top:16px; border-top:2px dashed #334155; padding-top:12px; text-align:center; font-size:0.75rem; color:#94a3b8;">
      🖨️ Thank you for printing with AfterHours!
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://rqzvjnhjeqnfpsiemcwh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxenZqbmhqZXFuZnBzaWVtY3doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mjc0MTcsImV4cCI6MjEwNzMwMzQxN30.Qpg19alABUF3sJ76PPlVjonVQ7Kf7YhHGm8yUonUHsQ';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allOrders = [];
  let currentTab = 'active';

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  }

  async function fetchOrders() {
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('ordersContainer').innerHTML = `<div class="empty-state" style="color: var(--danger);">Failed to load orders: ${error.message}</div>`;
      return;
    }

    allOrders = orders || [];
    renderOrders();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
    renderOrders();
  }

  function renderOrders() {
    const container = document.getElementById('ordersContainer');
    const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();

    // 1. Separate Active vs Completed orders
    const activeOrders = allOrders.filter(o => o.status !== 'Completed');
    const completedOrders = allOrders.filter(o => o.status === 'Completed');

    // Update tab badges
    document.getElementById('activeBadge').textContent = activeOrders.length;
    document.getElementById('completedBadge').textContent = completedOrders.length;

    // 2. Select order set for current tab
    let displayList = (currentTab === 'active') ? activeOrders : completedOrders;

    // 3. Apply search filter by customer name or file name
    if (searchQuery) {
      displayList = displayList.filter(order => {
        const nameMatch = (order.customer_name || 'Guest').toLowerCase().includes(searchQuery);
        const fileMatch = Array.isArray(order.files_data) && order.files_data.some(f => ((f.name || f.fileName || '')).toLowerCase().includes(searchQuery));
        return nameMatch || fileMatch;
      });
    }

    if (displayList.length === 0) {
      if (searchQuery) {
        container.innerHTML = `<div class="empty-state">No orders matching "${searchQuery}" found.</div>`;
      } else if (currentTab === 'active') {
        container.innerHTML = `<div class="empty-state">🎉 All clear! No active orders in queue.</div>`;
      } else {
        container.innerHTML = `<div class="empty-state">📁 Completed order archive is empty.</div>`;
      }
      return;
    }

    container.innerHTML = '';

    displayList.forEach(order => {
      const isCompleted = order.status === 'Completed';
      const orderCard = document.createElement('div');
      orderCard.className = `order-card ${isCompleted ? 'completed' : ''}`;

      const dateStr = new Date(order.created_at).toLocaleString();
      const payClass = order.payment_method === 'Cash' ? 'pay-cash' : 'pay-online';

      let filesHTML = '';
      let grandTotalPages = 0;

      if (Array.isArray(order.files_data)) {
        order.files_data.forEach(file => {
          const { data: publicUrlData } = supabaseClient
            .storage
            .from('customer-files')
            .getPublicUrl(file.path);

          let specsHTML = '';
          if (Array.isArray(file.print_details) && file.print_details.length > 0) {
            const papers = [...new Set(file.print_details.map(d => d.paper))];
            const hasColor = file.print_details.some(d => d.category !== 'Black & White');
            const filePageCount = file.print_details.reduce((sum, d) => sum + (d.pages ? d.pages.length : 0), 0);

            grandTotalPages += (filePageCount * (file.copies || 1));

            const paperBadges = papers.map(p => `<span class="paper-badge">${p}</span>`).join(' ');
            const colorModeTag = hasColor 
              ? '<span style="color: #38bdf8; font-weight: bold;">🌈 Colored</span>' 
              : '<span style="color: #cbd5e1; font-weight: bold;">📄 B&W</span>';
            const pageCountTag = filePageCount > 0 
              ? `<span style="color: var(--text-muted);">(${filePageCount} page${filePageCount > 1 ? 's' : ''})</span>` 
              : '';

            specsHTML = `
              <div class="spec-item" style="margin-top: 6px;">
                ${paperBadges} ${colorModeTag} ${pageCountTag}
              </div>
            `;
          } else {
            specsHTML = `<div class="spec-item" style="color: var(--text-muted);">Standard Document</div>`;
          }

          const copyLabel = file.copies > 1 ? `<span class="copy-badge">${file.copies} Copies</span>` : `<span class="copy-badge">1 Copy</span>`;
          const fileNameStr = file.name || file.fileName || 'Document';

          filesHTML += `
            <div class="file-row">
              <div class="file-details">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <div class="file-title">📄 ${fileNameStr}</div>
                  ${copyLabel}
                </div>
                <div class="specs-list">
                  ${specsHTML}
                </div>
              </div>
              <a href="${publicUrlData.publicUrl}" download target="_blank" class="btn-download">
                📥 Download PDF
              </a>
            </div>
          `;
        });
      }

      orderCard.innerHTML = `
        <div class="order-header">
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <h3 class="customer-title" style="margin:0;">👤 ${order.customer_name || 'Guest'}</h3>
              <button onclick="event.stopPropagation(); window.openOrderReceipt('${order.id}')" style="background:#0284c7; color:#fff; border:none; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; position:relative; z-index:10;">
                👁️ View Receipt
              </button>
            </div>
            <div class="order-time">Received: ${dateStr}</div>
          </div>
          <span class="pay-tag ${payClass}">${order.payment_method}</span>
        </div>

        <div class="files-list">
          ${filesHTML || '<div style="color: var(--text-muted);">No file details attached.</div>'}
        </div>

        <div class="order-footer">
          <div style="display: flex; gap: 24px; align-items: center;">
            <div>
              <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Total Amount:</span>
              <div class="order-total">₱${order.total_amount}</div>
            </div>
            <div>
              <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Total Pages:</span>
              <div style="font-size: 1.15rem; font-weight: 800; color: #fff;">${grandTotalPages} Pages</div>
            </div>
          </div>
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted); display:block; margin-bottom: 2px;">STATUS:</label>
            <select class="status-select" onchange="updateOrderStatus('${order.id}', this.value)">
              <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
              <option value="Printing" ${order.status === 'Printing' ? 'selected' : ''}>🖨️ Printing</option>
              <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
            </select>
          </div>
        </div>
      `;

      container.appendChild(orderCard);
    });
  }

  async function updateOrderStatus(orderId, newStatus) {
    const { error } = await supabaseClient
      .from('orders')
      .update({ status: newStatus })
      .eq('id', orderId);

    if (error) {
      console.error('Status Update Error:', error);
      alert('Failed to update status: ' + error.message);
    } else {
      fetchOrders();
    }
  }

  function setupRealtimeListener() {
    supabaseClient
      .channel('public:orders')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
        playBeep();
        fetchOrders();
      })
      .subscribe();
  }

  // Explicitly attach receipt modal handlers to window scope
  window.openOrderReceipt = function(orderId) {
    const order = (typeof allOrders !== 'undefined' ? allOrders : []).find(o => String(o.id) === String(orderId));
    
    if (!order) {
      alert('Order details not found.');
      return;
    }

    const modal = document.getElementById('receiptModal');
    const receiptBody = document.getElementById('receiptBody');

    let filesHtml = '';
    let grandTotalPages = 0;

    if (Array.isArray(order.files_data) && order.files_data.length > 0) {
      order.files_data.forEach(f => {
        const docName = f.name || f.fileName || 'Document';
        let specsTag = '';
        
        if (Array.isArray(f.print_details) && f.print_details.length > 0) {
          const papers = [...new Set(f.print_details.map(d => d.paper))].join(', ');
          const hasColor = f.print_details.some(d => d.category !== 'Black & White');
          const pageCount = f.print_details.reduce((sum, d) => sum + (d.pages ? d.pages.length : 0), 0);
          
          grandTotalPages += (pageCount * (f.copies || 1));
          
          specsTag = `
            <div style="display:flex; gap:6px; align-items:center; margin-top:4px; font-size:0.75rem;">
              <span style="background:#000; color:#38bdf8; padding:1px 5px; border-radius:3px; font-family:monospace; border:1px solid #38bdf8;">${papers}</span>
              <span style="color:${hasColor ? '#38bdf8' : '#cbd5e1'}; font-weight:bold;">${hasColor ? '🌈 Color' : '📄 B&W'}</span>
              <span style="color:#94a3b8;">(${pageCount} pgs)</span>
            </div>`;
        } else {
          specsTag = `<div style="color:#94a3b8; font-size:0.75rem; margin-top:2px;">Standard Print Job</div>`;
        }

        filesHtml += `
          <div style="background:#0f172a; border:1px solid #334155; border-radius:8px; padding:10px; margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:700; color:#fff; font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:210px;" title="${docName}">📄 ${docName}</span>
              <span style="background:rgba(255,255,255,0.1); color:#fff; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold;">${f.copies || 1} Copies</span>
            </div>
            ${specsTag}
          </div>`;
      });
    } else {
      filesHtml = '<div style="color:#94a3b8; font-size:0.8rem; text-align:center;">No document details attached.</div>';
    }

    const formattedDate = order.created_at ? new Date(order.created_at).toLocaleString() : 'N/A';
    const isCash = order.payment_method === 'Cash';
    const payTag = isCash 
      ? '<span style="background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid #f59e0b; padding:2px 8px; border-radius:6px; font-size:0.75rem; font-weight:bold;">Cash on Pickup</span>'
      : '<span style="background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid #38bdf8; padding:2px 8px; border-radius:6px; font-size:0.75rem; font-weight:bold;">MariBank / GCash QR</span>';

    receiptBody.innerHTML = `
      <!-- Customer Info & Payment Header -->
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; background:#0f172a; padding:12px; border-radius:8px; border:1px solid #334155;">
        <div>
          <div style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase; font-weight:700; letter-spacing:0.5px;">Customer Name</div>
          <div style="font-size:0.95rem; font-weight:800; color:#fff; margin-top:2px;">👤 ${order.customer_name || 'Guest'}</div>
          <div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">${formattedDate}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase; font-weight:700; letter-spacing:0.5px; margin-bottom:4px;">Payment Method</div>
          ${payTag}
        </div>
      </div>

      <!-- Print Job Items Breakdown -->
      <div style="margin-bottom:14px;">
        <div style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase; font-weight:700; letter-spacing:0.5px; margin-bottom:8px;">Print Job Details</div>
        ${filesHtml}
      </div>

      <!-- Summary Footer -->
      <div style="background:#0f172a; border:1px solid #334155; border-radius:10px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase; font-weight:700; letter-spacing:0.5px;">Total Pages</div>
          <div style="font-size:1rem; font-weight:800; color:#fff;">${grandTotalPages} Pages</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase; font-weight:700; letter-spacing:0.5px;">Total Amount</div>
          <div style="font-size:1.35rem; font-weight:900; color:#22c55e;">₱${order.total_amount || 0}</div>
        </div>
      </div>
    `;

    modal.style.display = 'flex';
  };

  window.closeReceiptModal = function() {
    document.getElementById('receiptModal').style.display = 'none';
  };

  // Initializations
  fetchOrders();
  setupRealtimeListener();
</script>

</body>
</html>
