<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epson L120 Print Estimator</title>
  <!-- PDF.js for rendering and analyzing PDF pages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Supabase JS Client for storage uploads -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2, h3 { color: #1a1a1a; margin-top: 0; }
    
    /* Control Panel */
    .admin-panel { background: #eef4ff; border: 1px solid #b6d4fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    label { font-size: 0.8rem; font-weight: bold; color: #444; }
    input[type="number"], select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    /* File Drop Zone */
    .upload-box { border: 2px dashed #0066cc; padding: 25px; text-align: center; border-radius: 8px; background: #f8fa2; margin-top: 15px; }
    .status { font-weight: bold; color: #0066cc; margin-top: 10px; }
    .error { color: #d9534f; font-weight: bold; margin-top: 10px; }

    /* Receipt Card */
    .receipt-container { background: #fff; border: 2px dashed #222; padding: 24px; font-family: 'Courier New', Courier, monospace; margin-top: 25px; border-radius: 6px; }
    .receipt-header { text-align: center; border-bottom: 2px solid #222; padding-bottom: 12px; margin-bottom: 16px; }
    .receipt-header h3 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; }
    .receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .receipt-table th { text-align: left; border-bottom: 2px solid #222; padding-bottom: 8px; font-size: 0.85rem; }
    .receipt-table td { padding: 10px 0; border-bottom: 1px dashed #ccc; vertical-align: top; font-size: 0.9rem; }
    .paper-tag { background: #222; color: #fff; padding: 2px 6px; font-weight: bold; border-radius: 3px; font-size: 0.75rem; }
    .receipt-footer { border-top: 2px solid #222; padding-top: 12px; display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: bold; }
    .total-price { color: #000; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h2>Print Shop Estimator</h2>

  <!-- OPERATOR CONFIGURATION PANEL -->
  <div class="admin-panel">
    <h3>⚙️ Base Settings & Paper Options</h3>
    <div class="admin-grid">
      <div>
        <label>Paper Selection:</label>
        <select id="paperType">
          <option value="SHORT">Short (Letter)</option>
          <option value="A4" selected>A4 Size</option>
          <option value="LONG">Long (Legal)</option>
        </select>
      </div>
      <div>
        <label>B&W Rate (₱):</label>
        <input type="number" id="rateBW" value="2">
      </div>
      <div>
        <label>Light Rate (₱):</label>
        <input type="number" id="rateLight" value="4">
      </div>
      <div>
        <label>Medium Rate (₱):</label>
        <input type="number" id="rateMed" value="6">
      </div>
      <div>
        <label>Heavy Rate (₱):</label>
        <input type="number" id="rateHeavy" value="10">
      </div>
    </div>
  </div>

  <!-- UPLOAD SECTION -->
  <div class="upload-box">
    <h3>📄 Upload PDF Document</h3>
    <input type="file" id="pdfUpload" accept="application/pdf">
    <div id="status" class="status"></div>
  </div>

  <!-- RECEIPT CARD -->
  <div id="receiptBox" class="receipt-container" style="display:none;">
    <div class="receipt-header">
      <h3>=== PRINT ORDER RECEIPT ===</h3>
      <p id="receiptDate" style="margin: 5px 0 0 0; font-size: 0.85rem;"></p>
    </div>

    <table class="receipt-table">
      <thead>
        <tr>
          <th>PAPER</th>
          <th>COVERAGE & PAGES</th>
          <th>QTY</th>
          <th>RATE</th>
          <th style="text-align:right;">SUBTOTAL</th>
        </tr>
      </thead>
      <tbody id="receiptRows"></tbody>
    </table>

    <div class="receipt-footer">
      <span>TOTAL AMOUNT DUE:</span>
      <span class="total-price">₱<span id="receiptTotal"></span></span>
    </div>
  </div>
</div>

<script>
  // 1. SUPABASE CONFIGURATION (Replace with your actual keys)
  const SUPABASE_URL = 'https://rqzvjnhjeqnfpsiemcwh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxenZqbmhqZXFuZnBzaWVtY3doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mjc0MTcsImV4cCI6MjEwNzMwMzQxN30.Qpg19alABUF3sJ76PPlVjonVQ7Kf7YhHGm8yUonUHsQ';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  document.getElementById('pdfUpload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const statusDiv = document.getElementById('status');
    statusDiv.className = 'status';

    // File Size Guardrail (25 MB)
    if (file.size > 25 * 1024 * 1024) {
      statusDiv.className = 'error';
      statusDiv.textContent = 'Error: File size exceeds 25 MB limit.';
      return;
    }

    statusDiv.textContent = 'Analyzing PDF pages and uploading to cloud...';

    // Upload File to Supabase Bucket: customer-files
    const fileName = `${Date.now()}_${file.name}`;
    const { data: uploadData, error: uploadError } = await supabaseClient
      .storage
      .from('customer-files')
      .upload(fileName, file);

    if (uploadError) {
      console.warn('Upload Warning:', uploadError.message);
      statusDiv.textContent = 'PDF analyzed locally.';
    } else {
      statusDiv.textContent = 'PDF analyzed & synced with print queue successfully!';
    }

    // Read Rate Configurations
    const paperTag = document.getElementById('paperType').value;
    const rBW = parseInt(document.getElementById('rateBW').value);
    const rLight = parseInt(document.getElementById('rateLight').value);
    const rMed = parseInt(document.getElementById('rateMed').value);
    const rHeavy = parseInt(document.getElementById('rateHeavy').value);

    const fileReader = new FileReader();
    fileReader.onload = async function() {
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;

      let categories = {
        'Black & White': { pages: [], rate: rBW },
        'Light Color': { pages: [], rate: rLight },
        'Medium Color': { pages: [], rate: rMed },
        'Heavy Color': { pages: [], rate: rHeavy }
      };

      // Loop through physical PDF pages
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 0.25 });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let coloredPixels = 0;
        let totalPixels = imgData.length / 4;

        for (let i = 0; i < imgData.length; i += 4) {
          let r = imgData[i], g = imgData[i+1], b = imgData[i+2];

          // Ignore paper background noise/textures
          if (r > 220 && g > 220 && b > 220) continue;

          // Detect chroma variance
          if (Math.abs(r - g) > 18 || Math.abs(r - b) > 18 || Math.abs(g - b) > 18) {
            coloredPixels++;
          }
        }

        let ratio = coloredPixels / totalPixels;

        if (ratio < 0.008) {
          categories['Black & White'].pages.push(pageNum);
        } else if (ratio < 0.06) {
          categories['Light Color'].pages.push(pageNum);
        } else if (ratio < 0.20) {
          categories['Medium Color'].pages.push(pageNum);
        } else {
          categories['Heavy Color'].pages.push(pageNum);
        }
      }

      // Render Receipt Rows
      const tbody = document.getElementById('receiptRows');
      tbody.innerHTML = '';
      let totalCharge = 0;

      for (const [catName, data] of Object.entries(categories)) {
        if (data.pages.length === 0) continue;
        let qty = data.pages.length;
        let subtotal = qty * data.rate;
        totalCharge += subtotal;

        let pageStr = data.pages.join(', ');

        let row = `<tr>
          <td><span class="paper-tag">${paperTag}</span></td>
          <td><strong>${catName}</strong><br><small>↳ Pages: ${pageStr}</small></td>
          <td>${qty}</td>
          <td>₱${data.rate}</td>
          <td style="text-align:right;">₱${subtotal}</td>
        </tr>`;
        tbody.innerHTML += row;
      }

      document.getElementById('receiptDate').textContent = `Date: ${new Date().toLocaleDateString()}`;
      document.getElementById('receiptTotal').textContent = totalCharge;
      document.getElementById('receiptBox').style.display = 'block';
    };

    fileReader.readAsArrayBuffer(file);
  });
</script>
</body>
</html>
